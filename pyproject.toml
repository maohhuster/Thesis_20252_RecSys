[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-movielens"
version = "1.0.0"
description = "LLM Feature Engineering Benchmark for MovieLens 20M"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Anonymous"},
]
keywords = ["recommendation", "collaborative-filtering", "llm", "benchmark", "movielens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Deep learning
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "scipy>=1.10.0",
    # Sentence transformers
    "sentence-transformers>=2.2.0",
    # ML utilities
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    # HuggingFace data loading
    "datasets>=2.14.0",
    "huggingface-hub>=0.17.0",
]

[project.optional-dependencies]
profile-gen = [
    "anthropic>=0.40.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
all = ["llm-movielens[profile-gen,dev]"]

[project.urls]
Homepage = "https://github.com/anonyauthor4review-png/llm-movielens"
Dataset = "https://huggingface.co/datasets/anonyauthor4review/llm-movielens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
